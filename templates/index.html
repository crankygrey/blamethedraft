<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote to Play</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <div class="mx-auto max-w-5xl px-4 py-16">
    <div class="rounded-2xl border border-slate-700 bg-slate-800/80 p-8 shadow-2xl shadow-slate-950/40 backdrop-blur-sm">
      <div class="mb-8 text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.35em] text-cyan-400">Dota 2 Party Picks</p>
        <h1 class="mt-4 text-4xl font-black tracking-tight text-white md:text-6xl">Vote to Play</h1>
      </div>

      <div class="grid gap-6 md:grid-cols-2">
        <section class="rounded-xl border border-slate-700 bg-slate-900/70 p-6">
          <h2 class="mb-4 text-2xl font-bold text-cyan-300">Create a room</h2>
          <form action="/room" method="get" class="space-y-4">
            <div>
              <label for="create-username" class="mb-2 block text-sm font-medium text-slate-300">Your username</label>
              <input id="create-username" name="username" type="text" maxlength="20" required class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-white outline-none ring-0 transition focus:border-cyan-400">
            </div>
            <div>
              <label for="create-room" class="mb-2 block text-sm font-medium text-slate-300">Room code</label>
              <input id="create-room" name="room_code" type="text" maxlength="8" placeholder="AB12C" class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-white outline-none transition focus:border-cyan-400">
            </div>
            <button type="submit" class="w-full rounded-lg bg-cyan-500 px-5 py-3 font-semibold text-slate-950 transition hover:bg-cyan-400">Create room</button>
          </form>
        </section>

        <section class="rounded-xl border border-slate-700 bg-slate-900/70 p-6">
          <h2 class="mb-4 text-2xl font-bold text-violet-300">Join a room</h2>
          <form action="/room" method="get" class="space-y-4">
            <div>
              <label for="join-username" class="mb-2 block text-sm font-medium text-slate-300">Your username</label>
              <input id="join-username" name="username" type="text" maxlength="20" required class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-white outline-none transition focus:border-violet-400">
            </div>
            <div>
              <label for="join-room" class="mb-2 block text-sm font-medium text-slate-300">Room code</label>
              <input id="join-room" name="room_code" type="text" maxlength="8" placeholder="AB12C" required class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-white outline-none transition focus:border-violet-400">
            </div>
            <button type="submit" class="w-full rounded-lg bg-violet-500 px-5 py-3 font-semibold text-white transition hover:bg-violet-400">Join room</button>
          </form>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
